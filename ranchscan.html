<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property 3D Scan</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    
    <!-- Import the model-viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

    <style>
        /* Reset margins and ensure the page takes up the full screen */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #e5e7eb; /* A neutral gray background */
            overflow: hidden; /* Hides scrollbars */
            font-family: sans-serif;
        }

        #page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding-bottom: 0;
        }

        #header {
            flex: 0 0 5.5em;
            height: auto;
            background: #222835;
        }

        #logo {
            display: none;
        }

        #nav {
            top: 0.75em;
        }

        @media screen and (max-width: 980px) {
            #page-wrapper {
                padding-top: 44px;
            }

            #header {
                display: none;
            }

            #titleBar {
                background: #222835;
            }
        }

        /* Make the 3D viewer fill the entire screen */
        model-viewer {
            flex: 1;
            min-height: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="page-wrapper">
        <header id="header">
            <div id="logo">
                <h1><a href="index.html">Dominick Trusko</a></h1>
            </div>
            <nav id="nav" aria-label="Main navigation"></nav>
        </header>

    <!-- Render the 3D model using the path you provided -->
    <model-viewer 
        src="/assets/meshes/ranchmesh.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1"
        alt="A 3D scan of the property">
    </model-viewer>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.dropotron.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/navigation.js?v=2264899d68"></script>
    <script src="assets/js/main.js"></script>

</body>
</html>
